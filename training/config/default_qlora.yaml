# General QLoRA defaults (reference only).
#
# CANONICAL first Colab GPU experiment:
#   training/config/colab_qlora.yaml
#
# Training requires:
#   python -m training.scripts.train_qlora \
#     --config training/config/colab_qlora.yaml \
#     --i-understand-this-starts-training

model:
  name: Qwen/Qwen2.5-3B-Instruct
  trust_remote_code: false

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: training/adapters/runs/default
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  bf16: false
  fp16: true
  gradient_checkpointing: true
  max_seq_length: 2048
  packing: false
  seed: 42
  report_to: none

data:
  train_path: training/data/train
  validation_path: training/data/validation
  held_out_eval_path: training/data/held_out_eval

safety:
  require_explicit_train_flag: true
  require_cuda: true
  require_4bit: true
  allow_model_download_with_ack: true
  never_mix_held_out: true

evaluation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
